# Optional local PostgreSQL for the synthetic demo (an alternative to PostgreSQL in WSL).
# One server on localhost:5432 with the three databases the README and tests expect:
#   gst_copilot_dev, gst_copilot_test, gst_copilot_e2e_test
# Demo credentials only; never use them anywhere else.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gst_copilot_dev
    ports:
      - "127.0.0.1:5432:5432"   # bound to this machine only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create_test_databases.sql:/docker-entrypoint-initdb.d/create_test_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
